<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red light &mdash; DaddyGoFaster</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Barlow:wght@400;500&family=Courier+Prime:wght@400&display=swap" rel="stylesheet">
<style>
:root{--tarmac:#120E0C;--grit:#2E2420;--afterburn:#FF5A1F;--bone:#F2EBE1;--dust:#A2948A;
  --display:"Archivo",system-ui,sans-serif;--body:"Barlow",system-ui,sans-serif;--data:"Courier Prime",monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 24px;
  background:var(--tarmac);color:var(--bone);font-family:var(--body);
  background-image:radial-gradient(60% 50% at 50% 100%,rgba(255,90,31,.16),transparent 70%)}
.tag{font-family:var(--data);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--dust)}
h1{font-family:var(--display);font-stretch:125%;font-weight:900;text-transform:uppercase;
  font-size:clamp(3rem,16vw,9rem);line-height:.84;letter-spacing:-.035em;margin:18px 0 0}
h1 em{font-style:normal;color:#E5484D}
p{max-width:38ch;margin:20px auto 0;color:var(--dust)}
a{display:inline-block;margin-top:32px;font-family:var(--data);font-size:.78rem;letter-spacing:.2em;
  text-transform:uppercase;text-decoration:none;background:var(--afterburn);color:#120E0C;font-weight:700;padding:15px 26px;transition:.2s}
a:hover{background:#FFC23D}
a:focus-visible{outline:2px solid #16B3A3;outline-offset:3px}
.bulb{width:26px;height:26px;border-radius:50%;background:#E5484D;margin:0 auto;
  box-shadow:0 0 18px rgba(229,72,77,.9),0 0 46px rgba(229,72,77,.35)}
</style>
</head>
<body>
  <div>
    <div class="bulb"></div>
    <h1><em>Red</em> light.</h1>
    <p class="tag" style="margin-top:18px">Error 404 &middot; Left too early</p>
    <p>That page is not on this property. Back up, re-stage, and try the line again.</p>
    <a href="/">Back to the start</a>
  </div>
</body>
</html>
