name = "dgf-bids"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "dgf-bids"
database_id = "7689b940-06a7-432a-a0a4-be60e2c4ac8e"

# Every minute: close a round that has run past its time, charge the winner's card,
# release every other hold.
[triggers]
crons = ["* * * * *"]

[vars]
# "true" opens bidding. Anything else and the site shows "Bidding opens soon".
OPEN = "false"
# Time policy lives in src/rules.js: any winning bid includes up to 60 minutes;
# each full $200 adds another hour to the cap. The owner approves actual duration.
# Bidding for a job day closes at CLOSE_HOUR (24-hour clock) in TIME_ZONE the evening before.
TIME_ZONE = "America/Chicago"
CLOSE_HOUR = "20"
# A bid in the last EXTEND_MINUTES adds EXTEND_MINUTES to the clock.
EXTEND_MINUTES = "5"
# Bids one email address may land per job day (tries that fall short or break a rule are capped at four times this).
MAX_BIDS_PER_DAY = "5"
# Sites allowed to call the public endpoints from a browser.
ALLOWED_ORIGINS = "https://torchhive.com,https://www.torchhive.com,https://daddygofaster.com,https://www.daddygofaster.com"
# Claude model that screens bids once an AI key is set.
SCREEN_MODEL = "claude-opus-5-5"
# The screen uses OpenAI instead when the Worker secret OPENAI_API_KEY is set. This is the model it asks.
OPENAI_MODEL = "gpt-4.1"
# Where links in emails point.
SITE_URL = "https://torchhive.com"
# Who outbid emails come from. The domain has to be verified with the email provider (Resend).
MAIL_FROM = "TorchHive <alerts@mail.torchhive.com>"
# This service's own address, for the "stop these emails" link in alert emails.
API_URL = "https://dgf-bids.trevor-c2b.workers.dev"
# Sign in with Google: the site's public client id from Google Cloud. Empty means the Google button is not shown.
GOOGLE_CLIENT_ID = "972489578684-n2bhgss1vf5b48q78ircr2bibt2ec2rl.apps.googleusercontent.com"
# Notifications on people's devices: the public half of the push key pair. The private half is the
# Worker secret VAPID_PRIVATE. With either missing, the site does not offer device notifications.
VAPID_PUBLIC = "BAl938Ccvgkf7_A-SvOAfEsatBB3cPem-tFJydyQNO-LjS4GRyjCYYAq197ZiJDWM4-tt1PrEvG7MWrTeRbbwb0"

# Card holds (Stripe) are on when both of these are set as Worker secrets:
#   STRIPE_SECRET_KEY        holds, charges and releases
#   STRIPE_PUBLISHABLE_KEY   handed to the site's page so it can show the card box
# With either missing, bids need no card and the owner collects payment by hand.

# Keys are not kept in this file.
#   VAULT_KEY   a Worker secret, set once at random. It seals the keys below in the database.
#   admin key, email key, AI key: handed to POST /admin/api/setup (see README.md). The
#   admin key is stored as a salted hash; the other two are stored sealed.
