name = "dgf-bids"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "dgf-bids"
database_id = "7689b940-06a7-432a-a0a4-be60e2c4ac8e"

[vars]
# "true" opens bidding. Anything else and the site shows "Bidding opens soon".
OPEN = "false"
# Dollars per hour a bid has to cover.
RATE_PER_HOUR = "200"
# Bidding for a job day closes at CLOSE_HOUR (24-hour clock) in TIME_ZONE the evening before.
TIME_ZONE = "America/Chicago"
CLOSE_HOUR = "20"
# A bid in the last EXTEND_MINUTES adds EXTEND_MINUTES to the clock.
EXTEND_MINUTES = "5"
# Bids one email address may land per job day (tries that fall short or break a rule are capped at four times this).
MAX_BIDS_PER_DAY = "5"
# Sites allowed to call the public endpoints from a browser.
ALLOWED_ORIGINS = "https://daddygofaster.com,https://www.daddygofaster.com"
# Claude model that screens bids once an AI key is set.
SCREEN_MODEL = "claude-opus-5-5"
# Where links in emails point.
SITE_URL = "https://daddygofaster.com"
# Who outbid emails come from. The domain has to be verified with the email provider (Resend).
MAIL_FROM = "DaddyGoFaster <alerts@mail.daddygofaster.com>"

# Keys are not kept in this file.
#   VAULT_KEY   a Worker secret, set once at random. It seals the keys below in the database.
#   admin key, email key, AI key: handed to POST /admin/api/setup (see README.md). The
#   admin key is stored as a salted hash; the other two are stored sealed.
